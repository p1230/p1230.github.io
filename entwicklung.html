<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Äußerer Container, um Icon und Diashow nebeneinander zu setzen */
        .main-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px; /* Abstand zwischen Icon und Diashow */
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        /* Das statische Tastatur-Icon */
        .keyboard-hint {
            width: 80px; /* Breite des Icons */
            height: auto;
            opacity: 0.7;
        }

        .slideshow-container {
            flex-grow: 1;
            max-width: 600px;
            position: relative;
            font-family: sans-serif;
            overflow: hidden;
            background-color: #f9f9f9;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .gallery-item {
            display: none;
            flex-direction: column;
            width: 100%;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        .description {
            padding: 15px;
            text-align: center;
            background: #eee;
            font-weight: bold;
        }

        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            width: auto;
            padding: 16px;
            margin-top: -22px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            transition: 0.6s ease;
            border-radius: 0 3px 3px 0;
            user-select: none;
            background-color: rgba(0,0,0,0.3);
            text-decoration: none;
        }

        .next {
            right: 0;
            border-radius: 3px 0 0 3px;
        }

        .prev:hover, .next:hover {
            background-color: rgba(0,0,0,0.8);
        }

        .fade {
            animation: fadeAnim 0.5s;
        }

        @keyframes fadeAnim {
            from {opacity: .4} 
            to {opacity: 1}
        }

        /* Responsive: Icon über der Slideshow auf kleinen Bildschirmen */
        @media (max-width: 600px) {
            .main-wrapper {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <img src="Arrow keys illustration, highlight left right.svg" alt="Nutze Pfeiltasten" class="keyboard-hint">

    <div class="slideshow-container">
        <div class="gallery-item fade">
            <img src="AdrAbd2026-01-01.png" alt="Januar 2026">
            <div class="description">Januar 2026</div>
        </div>
        <div class="gallery-item fade">
            <img src="AdrAbd2026-02-01.png" alt="Februar 2026">
            <div class="description">Februar 2026</div>
        </div>
        <div class="gallery-item fade">
            <img src="ImagePlaceholder.svg" alt="März 2026">
            <div class="description">März 2026</div>
        </div>
        <a class="prev" onclick="changeSlide(-1)">&#10094;</a>
        <a class="next" onclick="changeSlide(1)">&#10095;</a>
    </div>
</div>

<script>
    let slideIndex = 0;
    showSlides(slideIndex);

    function changeSlide(n) {
        showSlides(slideIndex += n);
    }

    function showSlides(n) {
        let slides = document.getElementsByClassName("gallery-item");
        
        if (n >= slides.length) { slideIndex = 0; }
        if (n < 0) { slideIndex = slides.length - 1; }
        
        for (let i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";  
        }
        
        slides[slideIndex].style.display = "flex";  
    }

    document.addEventListener('keydown', function(event) {
        if (event.key === "ArrowLeft") {
            changeSlide(-1);
        } else if (event.key === "ArrowRight") {
            changeSlide(1);
        }
    });
</script>

</body>
</html>
