<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 300px); 
            gap: 20px;
            justify-content: center;
            font-family: sans-serif;
        }

        .gallery-item {
            display: flex;
            flex-direction: column;
            background-color: #f9f9f9;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        .description {
            padding: 10px;
            text-align: center;
            background: #eee;
            margin-top: auto; 
        }
    </style>
</head>
<body>

<div class="gallery-grid">
    <div class="gallery-item">
        <img src="AdrAbd2026-01-01.png" alt="Januar 2026">
        <div class="description">Januar 2026</div>
    </div>
    <div class="gallery-item">
        <img src="AdrAbd2026-02-01.png" alt="Februar 2026">
        <div class="description">Februar 2026</div>
    </div>
    <div class="gallery-item">
        <img src="ImagePlaceholder.svg" alt="März 2026">
        <div class="description">März 2026</div>
    </div>

    <div class="gallery-item">
        <img src="ImagePlaceholder.svg" alt="April 2026">
        <div class="description">April 2026</div>
    </div>
    <div class="gallery-item">
        <img src="ImagePlaceholder.svg" alt="Mai 2026">
        <div class="description">Mai 2026</div>
    </div>
    <div class="gallery-item">
        <img src="ImagePlaceholder.svg" alt="Juni 2026">
        <div class="description">Juni 2026</div>
    </div>

    <div class="gallery-item">
        <img src="ImagePlaceholder.svg" alt="Juli 2026">
        <div class="description">Juli 2026</div>
    </div>
    <div class="gallery-item">
        <img src="ImagePlaceholder.svg" alt="August 2026">
        <div class="description">August 2026</div>
    </div>
    <div class="gallery-item">
        <img src="ImagePlaceholder.svg" alt="September 2026">
        <div class="description">September 2026</div>
    </div>
</div>

</body>
</html>
